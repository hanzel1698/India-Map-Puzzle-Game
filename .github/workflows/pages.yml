name: Deploy to GitHub Pages

# The site is plain static files -- no build step -- so this just uploads the
# repository as-is and hands it to Pages.

# main only. The feature branch carries the same commits, and deploying both
# into one Pages site achieves nothing except contending for the concurrency
# group below -- and the github-pages environment only accepts the default
# branch anyway, so the non-default run would sit waiting and block the queue.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a run already
# publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # One-time manual step before this workflow can succeed:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      #
      # `enablement: true` is deliberately NOT used here. It asks the API to
      # create the Pages site, and the default GITHUB_TOKEN is not allowed to do
      # that even with `pages: write` -- it fails with "Resource not accessible
      # by integration". Turning Pages on is a repository-admin action, so it has
      # to happen once in the settings UI.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

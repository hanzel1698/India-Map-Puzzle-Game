<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="A gentle map-of-India jigsaw for very young children. Drag each state into place.">
<meta name="theme-color" content="#f6f1e6">
<title>India Map Puzzle</title>
<!-- Self-contained build. Everything is inline;
     this file needs no other files and no network. -->
<!-- Every path is relative. Root-absolute paths would break both file:// and
     GitHub Pages project sites, which are served from /<repo>/. -->
<style>
/* India Map Puzzle
 *
 * Sizing rules of thumb throughout: nothing interactive is smaller than 64px,
 * because the intended player is four and aiming with a whole hand.
 */

:root {
  --paper:   #f6f1e6;
  --ink:     #3d3730;
  --muted:   #8a8072;
  --line:    #e2d9c8;
  --accent:  #e2703a;
  --accent-2:#3f8f7d;
  --radius:  16px;
  --tray-h:  25vh;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  /* Stops Android pull-to-refresh and iOS rubber-banding from stealing a drag
     that starts near an edge. */
  overscroll-behavior: none;
  overflow: hidden;
}

body {
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;

  display: grid;
  /* 100dvh, not 100vh: on mobile 100vh includes the collapsing URL bar, which
     pushes the tray off the bottom of the screen. */
  height: 100vh;
  height: -webkit-fill-available;
  height: 100dvh;
  grid-template-rows: auto 1fr var(--tray-h);
  grid-template-areas: "hud" "board" "tray";
}

@media (orientation: landscape) and (min-width: 720px) {
  body {
    grid-template-columns: 1fr minmax(190px, 23vw);
    grid-template-rows: auto 1fr;
    grid-template-areas: "hud hud" "board tray";
  }
}

/* ---------- HUD ---------- */

.hud {
  grid-area: hud;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  border-bottom: 2px solid var(--line);
  background: #fffdf8;
  flex-wrap: wrap;
}

.title {
  font-size: clamp(15px, 2.4vw, 22px);
  margin: 0;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.levels { display: flex; gap: 8px; margin-left: auto; }

.chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 64px;
  min-height: 48px;
  padding: 4px 10px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
  line-height: 1.05;
}
.chip-num  { font-size: 19px; font-weight: 800; }
.chip-word { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
.chip[aria-selected="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.hud-right { display: flex; align-items: center; gap: 8px; }

.progress {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--muted);
  min-width: 56px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
  font-size: 21px;
  cursor: pointer;
  text-decoration: none;
  padding: 0;
}
#mute .icon-off { display: none; }
#mute[aria-pressed="true"] .icon-on  { display: none; }
#mute[aria-pressed="true"] .icon-off { display: block; }

/* ---------- Board ---------- */

.board-wrap {
  grid-area: board;
  min-height: 0;
  min-width: 0;
  padding: 6px;
}

#board {
  width: 100%;
  height: 100%;
  display: block;
  /* Without this a touch-drag starting on the map scrolls the page instead. */
  touch-action: none;
}

.slot-emoji  { opacity: .5; pointer-events: none; }
.inset-label { font-size: 17px; fill: var(--muted); font-weight: 700; }
.placed      { pointer-events: none; }

.slot-halo { opacity: .5; }

/* Escalating help: after a few misses the right slot starts asking for
   attention. Nobody loses this game, so it gets easier instead. */
.slot.nudge .slot-halo,
.slot.nudge > path { animation: nudge 1.3s ease-in-out infinite; }
.slot.nudge .slot-emoji { animation: nudge-emoji 1.3s ease-in-out infinite; }

@keyframes nudge {
  0%, 100% { opacity: .55; }
  50%      { opacity: 1; }
}
@keyframes nudge-emoji {
  0%, 100% { opacity: .5; }
  50%      { opacity: 1; }
}

.pop { animation: pop 280ms cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pop {
  from { transform: scale(1.16); }
  to   { transform: scale(1); }
}

/* ---------- Tray ---------- */

.tray {
/* The tray never scrolls. It holds exactly TRAY_MAX (6) pieces by design, so the
   tiles share the space instead of overflowing it.

   This is not just tidiness. Tiles carry `touch-action: none`, which they must,
   or a drag starting on one gets stolen by the browser as a scroll. But the tray
   is made entirely of tiles, so there is no surface left to swipe on -- a
   scrolling tray would be a tray whose clipped pieces are unreachable on touch.
   Making six always fit removes the conflict rather than papering over it. */
  grid-area: tray;
  display: flex;
  gap: 8px;
  padding: 8px;
  overflow: hidden;
  align-items: stretch;
  border-top: 2px solid var(--line);
  background: #fffdf8;
  touch-action: none;
}

@media (orientation: landscape) and (min-width: 720px) {
  .tray {
    flex-direction: column;
    border-top: none;
    border-left: 2px solid var(--line);
  }
}

/* Tiles divide the tray between them (`flex: 1 1 0`), so six always fit exactly
   whatever the screen. Hard-coded sizes cannot do this: they either overflow on
   a small screen or leave the rail half empty on a large one. */
.tile {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  cursor: grab;
  font: inherit;
  /* The tile is a full rectangle, so a thin state like Kerala is still easy to
     grab -- the child never has to hit the polygon itself. */
  touch-action: none;
}

/* In the landscape rail the tiles stack, so they divide the height instead --
   `flex: 1 1 0` on the column axis already does that. Nothing to override. */

.tile:focus-visible { outline: 4px solid var(--accent-2); outline-offset: 2px; }
.tile.taken { visibility: hidden; }

.tile-art  { display: block; width: 100%; flex: 1 1 auto; min-height: 0; }
.piece-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tile-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-align: center;
  line-height: 1.15;
  width: 100%;
  flex: 0 0 auto;
  /* Long names like "Dadra and Nagar Haveli and Daman and Diu" must not push the
     piece artwork out of a tile that is now only a sixth of the tray. */
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* ---------- Drag ghost ----------
   An HTML overlay rather than an SVG element. SVG has no z-index, so raising a
   dragged piece above the board would mean re-appending nodes mid-drag; a fixed
   div is always on top, is GPU-composited, and takes a cheap CSS drop-shadow. */

.ghost {
  position: fixed;
  left: 0;
  top: 0;
  pointer-events: none;
  z-index: 50;
  will-change: transform;
  filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .3));
}
.ghost .piece-svg { width: 100%; height: 100%; }

.ghost.wobble { animation: wobble 320ms ease-in-out; }
@keyframes wobble {
  0%, 100% { rotate: 0deg; }
  25%      { rotate: -6deg; }
  75%      { rotate: 6deg; }
}

/* ---------- Win overlay ---------- */

.win {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(61, 55, 48, .45);
  z-index: 60;
  padding: 20px;
}
.win[hidden] { display: none; }

.win-card {
  background: #fffdf8;
  border-radius: 24px;
  padding: 26px 30px;
  text-align: center;
  max-width: 420px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
}
.win-emoji { font-size: 56px; margin: 0 0 4px; }
.win-card h2 { margin: 0 0 6px; font-size: 26px; }
.win-card p  { margin: 0 0 6px; color: var(--muted); }
.win-actions { display: flex; gap: 10px; justify-content: center; margin: 18px 0 10px; flex-wrap: wrap; }

.big-btn {
  min-height: 56px;
  padding: 0 22px;
  border: none;
  border-radius: 14px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}
.ghost-btn { background: var(--accent-2); }
.big-btn[hidden] { display: none; }
.win-link { color: var(--muted); font-weight: 700; font-size: 14px; }

#confetti {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 55;
}

/* ---------- Sticker book ----------
   Shares the .win overlay chrome. The card scrolls, because thirty-nine slots
   will not fit on a tablet in landscape. */

.book-card {
  /* width:100% matters. The overlay centres its card with place-items, which
     makes the card shrink-to-fit -- and inside a shrink-to-fit box the grid's
     1fr columns have no definite width, so auto-fill collapses to one column
     and the stickers balloon. Giving it a definite width fixes both. */
  width: 100%;
  max-width: 620px;
  max-height: 84dvh;
  overflow-y: auto;
  text-align: left;
}
.book-card h2 { text-align: center; }
.book-h {
  margin: 14px 0 2px;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
}
.book-card .big-btn { display: block; margin: 8px auto 0; }

.win-link {
  border: none;
  background: none;
  font: inherit;
  cursor: pointer;
  text-decoration: underline;
}

/* ---------- Sticker book ---------- */

.book {
  grid-area: unset;
  padding: 18px;
  overflow-y: auto;
  height: 100%;
}
body.book-page {
  display: block;
  overflow: auto;
  height: auto;
  min-height: 100dvh;
}
.book h2 { margin: 6px 0 2px; font-size: 20px; }
.book-sub { margin: 0 0 16px; color: var(--muted); }

.sticker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.sticker {
  aspect-ratio: 1;
  border-radius: 20px;
  border: 3px dashed var(--line);
  background: #fffdf8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px;
  text-align: center;
}
.sticker.earned {
  border-style: solid;
  border-color: #f2c451;
  background: #fff8e4;
  box-shadow: 0 4px 0 #eadfc2;
}
.sticker-emoji { font-size: 34px; line-height: 1; }
.sticker.locked .sticker-emoji { filter: grayscale(1); opacity: .22; }
.sticker-name  { font-size: 11px; font-weight: 800; }
.sticker-cap   { font-size: 10px; color: var(--muted); }
.sticker.locked .sticker-name,
.sticker.locked .sticker-cap { opacity: .35; }

.back-link {
  display: inline-block;
  margin-bottom: 10px;
  color: var(--accent);
  font-weight: 800;
  text-decoration: none;
}

/* ---------- Accessibility ---------- */

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Cheap flat style for weak devices and for anyone who asked for less motion. */
body.low-fx .placed { filter: none !important; }
body.low-fx .ghost  { filter: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
</head>
<body>

<header class="hud">
  <h1 class="title">India Map Puzzle</h1>

  <div class="levels" role="tablist" aria-label="Choose how many pieces">
    <button class="chip" type="button" role="tab" data-level="1" aria-selected="true">
      <span class="chip-num">6</span><span class="chip-word">pieces</span>
    </button>
    <button class="chip" type="button" role="tab" data-level="2" aria-selected="false">
      <span class="chip-num">12</span><span class="chip-word">pieces</span>
    </button>
    <button class="chip" type="button" role="tab" data-level="3" aria-selected="false">
      <span class="chip-num">36</span><span class="chip-word">pieces</span>
    </button>
  </div>

  <div class="hud-right">
    <p class="progress" id="progress" aria-hidden="true"></p>
    <button class="icon-btn" id="mute" type="button" aria-pressed="false" aria-label="Turn sound off">
      <span class="icon-on">🔊</span><span class="icon-off">🔇</span>
    </button>
    <button class="icon-btn" id="open-stickers" type="button"
            aria-label="Open the sticker book" aria-expanded="false">⭐</button>
  </div>
</header>

<main class="board-wrap">
  <svg id="board" role="img" aria-label="Map of India with empty spaces for each state"></svg>
</main>

<section class="tray" id="tray" role="listbox"
         aria-label="Pieces to place. Pick one, then drop it on the map.">
</section>

<!-- Announcements for screen readers; also the fallback for anyone who cannot
     hear the spoken state names. -->
<p class="sr-only" id="live" aria-live="polite" role="status"></p>

<div class="win" id="win" hidden>
  <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <p class="win-emoji" id="win-emoji">🎉</p>
    <h2 id="win-title">You did it!</h2>
    <p id="win-sub">You finished the whole map.</p>
    <div class="win-actions">
      <button class="big-btn" type="button" id="again">Play again</button>
      <button class="big-btn ghost-btn" type="button" id="next">Next level</button>
    </div>
    <button class="win-link" type="button" id="win-stickers">See my stickers ⭐</button>
  </div>
</div>

<!-- The sticker book is an overlay rather than a second page. One page means one
     file, which is what lets the whole game ship as a single self-contained
     .html - and a small child is better off without a back button anyway. -->
<div class="win" id="book" hidden>
  <div class="win-card book-card" role="dialog" aria-modal="true" aria-labelledby="book-title">
    <h2 id="book-title">My Stickers</h2>

    <h3 class="book-h">Trophies</h3>
    <p class="book-sub" id="trophy-sub"></p>
    <div class="sticker-grid" id="trophies"></div>

    <h3 class="book-h">States I have placed</h3>
    <p class="book-sub" id="state-sub"></p>
    <div class="sticker-grid" id="states"></div>

    <button class="big-btn" type="button" id="close-book">Back to the puzzle</button>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<!-- Classic scripts, loaded in order. NOT ES modules: module scripts are fetched
     with CORS semantics, and on file:// the origin is null, so every import is
     blocked. `defer` preserves document order and runs before DOMContentLoaded,
     which is all the ordering we need. -->
<script>
/* js/config.js */
/* Tunables in one place. Everything a grown-up might want to adjust after
 * watching an actual four-year-old play is here rather than buried in logic. */
(function (IMP) {
  'use strict';

  IMP.config = {
    // Level 1 shows the 6 biggest, most distinctive states; each level adds more.
    LEVELS: [
      { level: 1, name: 'Six Big Ones', hint: '6 pieces' },
      { level: 2, name: 'Twelve States', hint: '12 pieces' },
      { level: 3, name: 'All of India', hint: '36 pieces' },
    ],

    // How many pieces sit in the tray at once, refilled from a shuffled queue.
    // Preschool visual search falls apart past roughly half a dozen choices, and
    // capping it also keeps each tile physically large enough to grab.
    TRAY_MAX: 6,

    // Snap distance as a fraction of the viewBox width, per level. Deliberately
    // enormous -- a four-year-old aiming at a state is doing well to land in the
    // right quarter of the country.
    SNAP_FRAC: { 1: 0.18, 2: 0.13, 3: 0.09 },
    SNAP_MIN: 40,           // absolute floor, viewBox units
    SNAP_BBOX_FACTOR: 0.6,  // big states get a proportionally bigger target

    // Nobody loses, so the game gets more helpful instead. After HINT_AFTER
    // misses on one piece its slot starts pulsing; after FORGIVE_AFTER, dropping
    // it anywhere on the board sends it home.
    HINT_AFTER: 3,
    FORGIVE_AFTER: 5,

    PIECE_PAD: 10,   // viewBox units of margin around a piece in the tray/ghost
    STROKE: 7,       // white jigsaw border width, viewBox units

    /* Speech.
     *
     * The phrases matter more than the settings. Handed a bare word, every TTS
     * engine falls back to citation form -- level pitch, no contour, hard stop,
     * which is exactly what "robotic" means. Give it a short punctuated phrase
     * and it applies a sentence intonation contour instead. Rotating the
     * wording stops the repetition from flattening it out again.
     *
     * These are data so the tone can be retuned without touching any logic.
     */
    SPEECH: {
      RATE: 0.9,     // full phrases drag at 0.85; still slow enough to follow
      PITCH: 1.05,   // 1.1 reads thin and chirpy, which itself sounds synthetic

      // Short: the child triggers this constantly, and it gets cut off the
      // moment they grab the next piece. Even a lone name gains a falling
      // contour from the full stop.
      PICKUP: ['{name}.', '{name}.', 'This is {name}.'],

      // Where the warmth belongs -- this one only fires on success.
      PLACED: [
        'Yes! {name}.',
        '{name}. Well done!',
        "That's right. {name}!",
        'Good one! {name}.',
        'Perfect. {name}!',
      ],

      WIN: ['Well done!', 'Brilliant!', 'You did it!'],
      WIN_ALL: ['You finished all of India!', 'The whole map! Amazing!'],
    },

    // Emoji come from the system font. If a device has no colour-emoji font they
    // render as tofu boxes -- flip this off and pieces fall back to name only.
    USE_EMOJI: true,

    // Cheerful, high-contrast against white borders. Deliberately not meaningful:
    // the emoji carries the matching cue, so colour-vision differences never
    // affect play.
    PALETTE: [
      '#f08a7a', '#6fb7e0', '#8fcf7a', '#f5c451', '#b99ae0',
      '#5fc9b8', '#f295b4', '#a8c96a', '#ef9f5c', '#7fa8e8',
    ],
  };
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/util.js */
/* Small shared helpers. No dependencies, no cleverness. */
(function (IMP) {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs, parent) {
    const node = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k === 'class') node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  function svg(tag, attrs, parent) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) {
      if (k === 'text') node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  /** Fisher-Yates, in place. */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  const clamp = (n, lo, hi) => (n < lo ? lo : n > hi ? hi : n);

  /**
   * Client pixels -> board viewBox units.
   *
   * All hit-testing happens in viewBox units, never pixels, so snapping behaves
   * identically on a phone and on a 4K monitor.
   */
  function toViewBox(board, clientX, clientY) {
    const ctm = board.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const p = board.createSVGPoint();
    p.x = clientX;
    p.y = clientY;
    const r = p.matrixTransform(ctm.inverse());
    return { x: r.x, y: r.y };
  }

  /** Scale factor from viewBox units to CSS pixels for the current layout. */
  function boardScale(board, viewW, viewH) {
    const r = board.getBoundingClientRect();
    // preserveAspectRatio="xMidYMid meet" letterboxes, so the effective scale is
    // whichever axis is the tighter fit.
    return Math.min(r.width / viewW, r.height / viewH);
  }

  function debounce(fn, ms) {
    let t = 0;
    return function () {
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(null, args), ms);
    };
  }

  const reducedMotion = () =>
    !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  IMP.util = {
    el, svg, shuffle, clamp, toViewBox, boardScale, debounce, reducedMotion, SVG_NS,
  };
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/store.js */
/* Persistence.
 *
 * localStorage throws outright in Safari private mode, and is unreliable on
 * file:// in several browsers. None of that should ever break the game, so every
 * access falls back to an in-memory object -- the child still plays, the stickers
 * just do not survive a reload.
 */
(function (IMP) {
  'use strict';

  const KEY_STICKERS = 'imp.v1.stickers';
  const KEY_SETTINGS = 'imp.v1.settings';

  const memory = {};
  let backend = null;

  try {
    const probe = '__imp_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    backend = window.localStorage;
  } catch (e) {
    backend = null;
  }

  function readRaw(key) {
    try {
      return backend ? backend.getItem(key) : memory[key] || null;
    } catch (e) {
      return memory[key] || null;
    }
  }

  function writeRaw(key, value) {
    memory[key] = value;
    try {

<script>
/* js/audio.js */
/* All sound is synthesised in the browser. No audio files anywhere in the repo,
 * which keeps the whole game a handful of text files.
 *
 * Every entry point is wrapped: if WebAudio is missing or blocked, the game must
 * carry on silently rather than break.
 */
(function (IMP) {
  'use strict';

  let ctx = null;
  let master = null;
  let muted = false;

  // Kept low on purpose. Tablet speakers are close to a small child's ears.
  const VOLUME = 0.25;

  function ensure() {
    if (ctx) return ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      master.connect(ctx.destination);
    } catch (e) {
      ctx = null;
    }
    return ctx;
  }

  /**
   * Browsers refuse to start an AudioContext outside a user gesture, so this is
   * called from the first pointerdown. iOS additionally suspends the context
   * whenever the tab goes to the background without ever telling us, which is
   * why resume() is also called before every single sound below.
   */
  function unlock() {
    const c = ensure();
    if (c && c.state === 'suspended') c.resume().catch(function () {});
  }

  function resume() {
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(function () {});
  }

  function tone(freq, start, dur, type, peak) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak || 0.6, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  /** Short filtered noise burst -- the physical "snap" of a piece seating. */
  function snap(start) {
    const len = Math.floor(ctx.sampleRate * 0.025);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2200;
    bp.Q.value = 1.2;
    const gain = ctx.createGain();
    gain.gain.value = 0.35;
    src.connect(bp);
    bp.connect(gain);
    gain.connect(master);
    src.start(start);
  }

  function guard(fn) {
    return function () {
      if (muted) return;
      const c = ensure();
      if (!c) return;
      resume();
      try {
        fn(c.currentTime);
      } catch (e) {
        /* never let a sound break the game */
      }
    };
  }

  const playPickup = guard(function (t) {
    tone(900, t, 0.06, 'sine', 0.4);
  });

  // Rising major triad: unambiguously "yes" to a child, and short enough that
  // placing pieces quickly does not turn into a drone.
  const playCorrect = guard(function (t) {
    snap(t);
    [1046.5, 1318.5, 1568.0].forEach(function (f, i) {
      tone(f, t + i * 0.06, 0.18, 'triangle', 0.5);
    });
  });

  /* Deliberately soft, low and slow -- a nudge, not a buzzer. A harsh error
     sound is exactly what makes a small child stop wanting to play. */
  const playWrong = guard(function (t) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const lp = ctx.createBiquadFilter();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = 180;
    lp.type = 'lowpass';
    lp.frequency.value = 800;

    lfo.frequency.value = 6;
    lfoGain.gain.value = 0.12;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);

    gain.gain.setValueAtTime(0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);

    osc.connect(lp);
    lp.connect(gain);
    gain.connect(master);

    osc.start(t);
    lfo.start(t);
    osc.stop(t + 0.28);
    lfo.stop(t + 0.28);
  });

  const playFanfare = guard(function (t) {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) {
      tone(f, t + i * 0.13, 0.4, 'triangle', 0.5);
    });
    // Slightly detuned pad underneath, so the last chord rings rather than beeps.
    [261.63, 329.63, 392.0].forEach(function (f) {
      tone(f, t + 0.5, 0.9, 'sine', 0.22);
      tone(f * 1.004, t + 0.5, 0.9, 'sine', 0.18);
    });
  });

  function setMuted(next) {
    muted = !!next;
    if (master && ctx) {
      try {
        master.gain.setTargetAtTime(muted ? 0 : VOLUME, ctx.currentTime, 0.02);
      } catch (e) {
        master.gain.value = muted ? 0 : VOLUME;
      }
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) resume();
  });

  IMP.audio = {
    unlock,
    playPickup,
    playCorrect,
    playWrong,
    playFanfare,
    setMuted,
    isMuted: function () { return muted; },
    // Test hook: lets Playwright assert no AudioContext exists before a gesture.
    _hasContext: function () { return ctx !== null; },
  };
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/speech.js */
/* Spoken state names.
 *
 * The player cannot read, so hearing "Rajasthan" as they pick the piece up is
 * how the name gets attached to the shape at all. But speech synthesis is the
 * flakiest API in the browser, so nothing here is ever load-bearing: the state
 * name is always also drawn as text on the tile, and every path degrades to a
 * silent no-op.
 */
(function (IMP) {
  'use strict';

  const synth = window.speechSynthesis;
  const supported = !!(synth && window.SpeechSynthesisUtterance);

  let voice = null;
  let muted = false;
  let picked = false;

  /**
   * Score every voice and take the best, rather than taking the first match.
   *
   * Language first: an Indian English voice, then Hindi, then any English, then
   * whatever exists. A US voice saying "Chhattisgarh" is rough, but silence is
   * worse.
   *
   * Then, within the same language, prefer a NON-local voice. Android's
   * network-backed voices are markedly more natural than the on-device ones, and
   * choosing them is the biggest quality gain available without shipping audio
   * files. Local voices stay eligible, so the game still speaks offline.
   */
  function scoreVoice(v) {
    const lang = (v.lang || '').replace('_', '-');
    let score;
    if (lang === 'en-IN') score = 400;
    else if (lang === 'hi-IN') score = 300;
    else if (/^en-/.test(lang)) score = 200;
    else score = 100;
    if (v.localService === false) score += 50;
    if (v.default) score += 1;      // tiebreak only
    return score;
  }

  function pickVoice() {
    if (!supported) return;
    let voices = [];
    try {
      voices = synth.getVoices() || [];
    } catch (e) {
      return;
    }
    if (!voices.length) return;

    voice = voices.reduce(function (best, v) {
      return !best || scoreVoice(v) > scoreVoice(best) ? v : best;
    }, null);
    picked = true;
  }

  if (supported) {
    pickVoice();
    // Voices load asynchronously. Some browsers fire voiceschanged, some fire it
    // only once, and some never fire it at all when the voices were already
    // there -- so subscribe AND set a timeout, and take whichever arrives.
    try {
      synth.addEventListener('voiceschanged', pickVoice);
    } catch (e) {
      synth.onvoiceschanged = pickVoice;
    }
    setTimeout(function () { if (!picked) pickVoice(); }, 1000);
  }

  function say(text) {
    if (!supported || muted || !text) return;
    try {
      // Cancel first. A child tapping pieces quickly would otherwise queue a
      // dozen utterances and leave the game talking to itself for a minute.
      synth.cancel();
      const u = new window.SpeechSynthesisUtterance(String(text));
      if (voice) {
        u.voice = voice;
        u.lang = voice.lang;
      }
      const cfg = (IMP.config && IMP.config.SPEECH) || {};
      u.rate = cfg.RATE || 0.9;
      u.pitch = cfg.PITCH || 1.05;
      // Note: Chrome cuts utterances off after ~15s. Everything here is under
      // two seconds, so this is not a problem -- do not add a keepalive timer.
      synth.speak(u);
    } catch (e) {
      /* speech is never load-bearing */
    }
  }

  /** iOS will not speak later unless something was spoken inside a gesture. */
  function unlock() {
    if (!supported) return;
    try {
      const u = new window.SpeechSynthesisUtterance(' ');
      u.volume = 0;
      synth.speak(u);
    } catch (e) {
      /* ignore */
    }
  }

  function setMuted(next) {
    muted = !!next;
    if (muted && supported) {
      try { synth.cancel(); } catch (e) { /* ignore */ }
    }
  }

  /* Remember the last template used for each kind, so the same wording never
     lands twice in a row. Repetition is half of what makes it sound mechanical. */
  const lastIndex = {};

  function choose(kind, bank) {
    if (!bank || !bank.length) return null;
    if (bank.length === 1) return bank[0];
    let i;
    do {
      i = Math.floor(Math.random() * bank.length);
    } while (i === lastIndex[kind]);
    lastIndex[kind] = i;
    return bank[i];
  }

  /**
   * Speak a state's name inside a short phrase.
   *
   * Always composed from `state.say` -- the phonetic respelling from
   * tools/meta/states.json -- so a state is pronounced identically whether it is
   * being picked up or placed. 29 of the 36 carry a respelling, so using the raw
   * name in one place and the respelling in the other was audible on most of the
   * map.
   *
   * @param {object} state
   * @param {'PICKUP'|'PLACED'} kind
   */
  function sayState(state, kind) {
    if (!state) return;
    const cfg = (IMP.config && IMP.config.SPEECH) || {};
    const template = choose(kind, cfg[kind]) || '{name}.';
    say(template.replace('{name}', state.say || state.name));
  }

  /** Speak one line from a named phrase bank in config. */
  function sayFrom(kind) {
    const cfg = (IMP.config && IMP.config.SPEECH) || {};
    const line = choose(kind, cfg[kind]);
    if (line) say(line);
  }

  IMP.speech = { say, sayState, sayFrom, unlock, setMuted, supported };
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/effects.js */
/* Confetti and the little celebratory flourishes.
 *
 * Everything here is decoration and must be skippable: if the device is weak or
 * the player asked for reduced motion, these become no-ops and the game plays
 * exactly the same.
 */
(function (IMP) {
  'use strict';

  const { reducedMotion } = IMP.util;

  const COLORS = ['#f08a7a', '#6fb7e0', '#8fcf7a', '#f5c451', '#b99ae0', '#5fc9b8'];

  let canvas = null;
  let ctx = null;
  let pieces = [];
  let raf = 0;

  function size() {
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init() {
    canvas = document.getElementById('confetti');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    size();
    window.addEventListener('resize', IMP.util.debounce(size, 150));
  }

  function confetti(count) {
    if (!ctx || reducedMotion()) return;
    const n = count || 120;
    const w = window.innerWidth;

    for (let i = 0; i < n; i++) {
      pieces.push({
        x: Math.random() * w,
        y: -20 - Math.random() * 200,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 2 + Math.random() * 3.2,
        size: 6 + Math.random() * 7,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.22,
        color: COLORS[(Math.random() * COLORS.length) | 0],
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick() {
    const h = window.innerHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces = pieces.filter(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045;
      p.rot += p.vr;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();

      return p.y < h + 40;
    });

    if (pieces.length) {
      raf = requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      raf = 0;
    }
  }

  function clear() {
    pieces = [];
    if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  /** Re-trigger a CSS animation on an element that may already carry the class. */
  function replay(node, className, ms) {
    if (!node) return;
    node.classList.remove(className);
    // Force a reflow so removing and re-adding actually restarts the animation.
    void node.offsetWidth;
    node.classList.add(className);
    setTimeout(function () { node.classList.remove(className); }, ms);
  }

  IMP.effects = { init, confetti, clear, replay };
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/render.js */
/* Builds the board SVG and the tray tiles.
 *
 * Layer order in the board matters and is fixed here:
 *   silhouette -> insets -> slots -> placed -> hint
 * SVG has no z-index; painting order IS stacking order, so a group appended
 * later always draws on top.
 *
 * Dragged pieces are deliberately NOT in this SVG at all -- see drag.js.
 */
(function (IMP) {
  'use strict';

  const { svg, el } = IMP.util;
  const CFG = IMP.config;

  const M = window.INDIA_MAP;
  const [, , VW, VH] = M.viewBox;

  const byId = {};
  M.states.forEach((s, i) => {
    byId[s.id] = s;
    s.color = CFG.PALETTE[i % CFG.PALETTE.length];
  });

  /** Padded viewBox string for showing one piece on its own. */
  function pieceViewBox(state) {
    const p = CFG.PIECE_PAD;
    const [x0, y0, x1, y1] = state.bbox;
    return `${x0 - p} ${y0 - p} ${x1 - x0 + p * 2} ${y1 - y0 + p * 2}`;
  }

  /**
   * One piece as standalone SVG markup, used by both the tray tile and the drag
   * ghost so the two can never drift apart visually.
   *
   * paint-order="stroke fill" draws the white border UNDER the fill, so the
   * visible edge is a clean outer halo and the state's actual shape is not
   * eroded by half the stroke width.
   */
  /**
   * Andaman & Nicobar and Lakshadweep are dozens of islands each a fraction of a
   * viewBox unit across -- at tile size they are sub-pixel and the piece looks
   * blank. Drawing them again underneath with a fat round stroke swells each
   * speck into a visible dot. This is the minimum-feature-size convention every
   * printed atlas uses; the geometry itself is untouched.
   */
  function islandDots(state) {
    if (!state.inset) return '';
    return (
      `<path d="${state.d}" fill="none" stroke="${state.color}" stroke-width="7" ` +
      `stroke-linejoin="round" stroke-linecap="round"/>`
    );
  }

  function pieceSVG(state, opts) {
    const o = opts || {};
    const [x0, y0, x1, y1] = state.bbox;
    const w = x1 - x0;
    const h = y1 - y0;
    const emojiSize = Math.max(16, Math.min(w, h) * 0.42);

    return (
      `<svg viewBox="${pieceViewBox(state)}" class="piece-svg" aria-hidden="true" focusable="false">` +
      `<path d="${state.d}" fill="${state.color}" stroke="#fff" stroke-width="${CFG.STROKE}" ` +
      `stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill"/>` +
      islandDots(state) +
      (CFG.USE_EMOJI && !o.noEmoji
        ? `<text x="${state.c[0]}" y="${state.c[1]}" class="piece-emoji" ` +
          `font-size="${emojiSize}" text-anchor="middle" dominant-baseline="central">${state.emoji}</text>`
        : '') +
      `</svg>`
    );
  }

  /** Build the board for a level. Returns a map of id -> placed <path>. */
  function buildBoard(board, activeStates) {
    board.setAttribute('viewBox', M.viewBox.join(' '));
    board.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    board.innerHTML = '';

    const defs = svg('defs', {}, board);
    const shadow = svg('filter', {
      id: 'fx-shadow',
      x: '-20%', y: '-20%', width: '140%', height: '140%',
    }, defs);
    svg('feDropShadow', {
      dx: 0, dy: 3, stdDeviation: 3, 'flood-color': '#000', 'flood-opacity': 0.28,
    }, shadow);

    // 1. The grey body of India. Always the full country, so level 1 still reads
    //    as India with six coloured pieces on it rather than six floating blobs.
    const gSil = svg('g', { id: 'g-silhouette' }, board);
    svg('path', {
      d: M.outline,
      fill: '#ded8cd',
      stroke: '#c9c2b4',
      'stroke-width': 2,
      'stroke-linejoin': 'round',
    }, gSil);

    // 2. Inset frames for the offshore territories.
    const gInsets = svg('g', { id: 'g-insets' }, board);
    M.insets.forEach((box) => {
      const s = byId[box.id];
      if (!activeStates.some((a) => a.id === box.id)) return;
      svg('rect', {
        x: box.x - 6, y: box.y - 6, width: box.w + 12, height: box.h + 12,
        rx: 10, fill: 'none', stroke: '#c9c2b4',
        'stroke-width': 2, 'stroke-dasharray': '10 8',
      }, gInsets);
      svg('text', {
        x: box.x + box.w / 2, y: box.y - 14,
        'text-anchor': 'middle', class: 'inset-label',
        // Short form: the full "Andaman and Nicobar Islands" is wider than the
        // box and runs back over the mainland.
        text: box.id === 'AN' ? 'Andaman & Nicobar' : s.name,
      }, gInsets);
    });

    // 3. Slots: where each piece belongs, shown as a recessed shape plus the
    //    matching emoji. The emoji is the whole trick for a child who cannot
    //    read -- they match picture to picture, not word to word.
    const gSlots = svg('g', { id: 'g-slots' }, board);
    const gPlaced = svg('g', { id: 'g-placed' }, board);
    const gHint = svg('g', { id: 'g-hint' }, board);

    const placed = {};

    activeStates.forEach((s) => {
      const slot = svg('g', { class: 'slot', 'data-id': s.id }, gSlots);
      // Noticeably darker than the surrounding silhouette. At level 1 only six
      // states are cut out of the map, and a four-year-old has to be able to see
      // at a glance which holes are waiting to be filled.
      svg('path', {
        d: s.d,
        fill: '#b3a894',
        // Island groups need the same dot treatment as their pieces, or the slot
        // they have to aim at is invisible too.
        stroke: s.inset ? '#b3a894' : '#9a8f7b',
        'stroke-width': s.inset ? 7 : 2.5,
        'stroke-linejoin': 'round',
        'stroke-linecap': 'round',
      }, slot);

      // Tiny states get a halo ring the size of the snap radius, so the child
      // has something to aim at that is bigger than three pixels of polygon.
      if (s.minScale > 1) {
        svg('circle', {
          class: 'slot-halo',
          cx: s.c[0], cy: s.c[1],
          r: Math.max(26, Math.hypot(s.bbox[2] - s.bbox[0], s.bbox[3] - s.bbox[1])),
          fill: 'none', stroke: '#a89e8b', 'stroke-width': 2.5,
          'stroke-dasharray': '6 6',
        }, slot);
      }

      if (CFG.USE_EMOJI) {
        const size = Math.max(
          18,
          Math.min(46, Math.min(s.bbox[2] - s.bbox[0], s.bbox[3] - s.bbox[1]) * 0.4)
        );
        svg('text', {
          class: 'slot-emoji',
          x: s.c[0], y: s.c[1],
          'font-size': size,
          'text-anchor': 'middle',
          'dominant-baseline': 'central',
          text: s.emoji,
        }, slot);
      }

      // The finished piece, invisible until it is placed.
      const group = svg('g', { class: 'placed-group', opacity: 0 }, gPlaced);
      const p = svg('path', {
        class: 'placed',
        'data-id': s.id,
        d: s.d,
        fill: s.color,
        stroke: '#fff',
        'stroke-width': CFG.STROKE,
        'stroke-linejoin': 'round',
        'stroke-linecap': 'round',
        'paint-order': 'stroke fill',
        filter: 'url(#fx-shadow)',
        opacity: 0,
      }, group);

      if (s.inset) {
        svg('path', {
          d: s.d,
          fill: 'none',
          stroke: s.color,
          'stroke-width': 7,
          'stroke-linejoin': 'round',
          'stroke-linecap': 'round',
        }, group);
      }

      placed[s.id] = p;
      p._group = group;
    });

    void gHint;
    return placed;
  }

  /** One tray tile: a real <button>, so keyboard and assistive tech work. */
  function buildTile(state) {
    const btn = el('button', {
      class: 'tile',
      type: 'button',
      role: 'option',
      'data-id': state.id,
      'aria-label': state.name,
      tabindex: '-1',
    });
    btn.innerHTML =
      `<span class="tile-art">${pieceSVG(state)}</span>` +
      `<span class="tile-name">${state.name}</span>`;
    return btn;
  }

  IMP.render = { buildBoard, buildTile, pieceSVG, pieceViewBox, byId, VW, VH, M };
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/drag.js */
/* Dragging, with Pointer Events.
 *
 * Pointer Events rather than mouse+touch pairs: one code path covers mouse,
 * finger and stylus, and pointer capture means the drag keeps working even when
 * the pointer leaves the element it started on -- which, with a four-year-old
 * aiming at Rajasthan, it always does.
 *
 * The dragged piece is an HTML div over the page, not an SVG node. SVG has no
 * z-index, so raising a piece above the board would mean re-appending nodes
 * mid-drag; a fixed-position div is always on top, is GPU-composited (which is
 * what keeps this at 60fps on a tablet), and takes a cheap CSS drop-shadow.
 */
(function (IMP) {
  'use strict';

  const CFG = IMP.config;
  const { toViewBox, boardScale } = IMP.util;

  let board = null;
  let ghost = null;
  let handlers = {};

  // Only one pointer at a time. A small child will absolutely put a second hand
  // on the screen mid-drag, and without this lock the piece teleports.
  let activeId = null;
  let current = null;

  function attach(boardEl, opts) {
    board = boardEl;
    handlers = opts || {};
    document.addEventListener('pointerdown', firstGesture, { once: true, capture: true });
  }

  /* Both WebAudio and iOS speech refuse to start outside a user gesture, so the
     very first pointerdown anywhere is where they get unlocked. */
  function firstGesture() {
    IMP.audio.unlock();
    IMP.speech.unlock();
  }

  function bindTile(tile, state) {
    tile.addEventListener('pointerdown', function (e) {
      if (activeId !== null) return;         // single-pointer lock
      if (e.button != null && e.button > 0) return;
      start(e, tile, state);
    });

    // Long-press on Android/iOS pops a context menu over the piece; the native
    // HTML5 drag on desktop hijacks the gesture entirely. Both must go.
    tile.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    tile.addEventListener('dragstart', function (e) { e.preventDefault(); });
  }

  function start(e, tile, state) {
    e.preventDefault();
    activeId = e.pointerId;

    try {
      tile.setPointerCapture(e.pointerId);
    } catch (err) {
      /* capture is an optimisation, not a requirement */
    }

    const scale = boardScale(board, IMP.render.VW, IMP.render.VH) * state.minScale;
    const pad = CFG.PIECE_PAD;
    const [x0, y0, x1, y1] = state.bbox;
    const w = (x1 - x0 + pad * 2) * scale;
    const h = (y1 - y0 + pad * 2) * scale;

    ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.style.width = w + 'px';
    ghost.style.height = h + 'px';
    ghost.innerHTML = IMP.render.pieceSVG(state);
    document.body.appendChild(ghost);

    // Hide with visibility rather than display, so the tray does not reflow and
    // shuffle the remaining tiles out from under the child's other hand.
    tile.classList.add('taken');

    current = {
      state,
      tile,
      w,
      h,
      // Grab the piece by its middle: a child does not aim at the exact spot
      // they touched, they aim the whole shape.
      offsetX: w / 2,
      offsetY: h / 2,
    };

    move(e);

    IMP.audio.playPickup();
    IMP.speech.sayState(state, 'PICKUP');

    tile.addEventListener('pointermove', onMove);
    tile.addEventListener('pointerup', onUp);
    tile.addEventListener('pointercancel', onCancel);
    tile.addEventListener('lostpointercapture', onCancel);
  }

  function move(e) {
    if (!ghost || !current) return;
    ghost.style.transform =
      'translate3d(' +
      (e.clientX - current.offsetX) + 'px,' +
      (e.clientY - current.offsetY) + 'px,0)';
  }

  function onMove(e) {
    if (e.pointerId !== activeId) return;
    e.preventDefault();
    // Coalesced events matter for a stylus; we only ever need the newest point.
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    move(events && events.length ? events[events.length - 1] : e);
  }

  function onUp(e) {
    if (e.pointerId !== activeId) return;
    e.preventDefault();
    finish(e.clientX, e.clientY);
  }

  /* pointercancel fires when the browser decides the gesture was really a scroll
     and takes it away from us. Dropping it on the floor leaves a ghost stuck on
     screen forever, so it has to return the piece just like a miss does. */
  function onCancel(e) {
    if (e.pointerId !== activeId) return;
    finish(null, null);
  }

  function snapRadius(state, level) {
    const frac = CFG.SNAP_FRAC[level] || CFG.SNAP_FRAC[3];
    const diag = Math.hypot(state.bbox[2] - state.bbox[0], state.bbox[3] - state.bbox[1]);
    return Math.max(IMP.render.VW * frac, diag * CFG.SNAP_BBOX_FACTOR, CFG.SNAP_MIN);
  }

  function finish(clientX, clientY) {
    if (!current) return cleanup();

    const state = current.state;
    const tile = current.tile;

    let correct = false;

    if (clientX != null) {
      const p = toViewBox(board, clientX, clientY);
      const level = handlers.getLevel ? handlers.getLevel() : 3;
      const dist = Math.hypot(p.x - state.c[0], p.y - state.c[1]);

      correct = dist <= snapRadius(state, level);

      // After enough tries, anywhere on the board is close enough. Nobody loses
      // this game -- if a child is stuck, the game gives in, not the child.
      if (!correct && handlers.misses && handlers.misses(state.id) >= CFG.FORGIVE_AFTER) {
        const inBoard = p.x >= 0 && p.y >= 0 && p.x <= IMP.render.VW && p.y <= IMP.render.VH;
        if (inBoard) correct = true;
      }
    }

    if (correct) {
      removeGhost();
      tile.remove();
      cleanup();
      if (handlers.onPlace) handlers.onPlace(state);
    } else {
      IMP.audio.playWrong();
      returnToTray(tile);
      if (handlers.onMiss) handlers.onMiss(state);
    }
  }

  /** Wobble, then fly back to the tray tile it came from. */
  function returnToTray(tile) {
    const g = ghost;
    const c = current;
    // Hand the node over to this animation before clearing drag state, so a
    // child who immediately grabs another piece gets a fresh ghost rather than
    // fighting this one for it.
    ghost = null;
    cleanup();
    if (!g || !c) return;

    g.classList.add('wobble');

    setTimeout(function () {
      const rect = tile.getBoundingClientRect();
      if (rect.width) {
        g.style.transition = 'transform 220ms ease-out, opacity 220ms ease-out';
        g.style.transform =
          'translate3d(' +
          (rect.left + rect.width / 2 - c.w / 2) + 'px,' +
          (rect.top + rect.height / 2 - c.h / 2) + 'px,0)';
      }
      g.style.opacity = '0';
      setTimeout(function () {
        g.remove();
        tile.classList.remove('taken');
      }, 230);
    }, IMP.util.reducedMotion() ? 0 : 320);
  }

  function removeGhost() {
    if (ghost) ghost.remove();
    ghost = null;
  }

  function cleanup() {
    if (current) {
      const t = current.tile;
      t.removeEventListener('pointermove', onMove);
      t.removeEventListener('pointerup', onUp);
      t.removeEventListener('pointercancel', onCancel);
      t.removeEventListener('lostpointercapture', onCancel);
      try {
        if (activeId !== null && t.hasPointerCapture && t.hasPointerCapture(activeId)) {
          t.releasePointerCapture(activeId);
        }
      } catch (e) {
        /* ignore */
      }
    }
    // The ghost is deliberately untouched here -- whoever called cleanup owns it,
    // because a miss still needs it around to animate back to the tray.
    current = null;
    activeId = null;
  }

  IMP.drag = { attach, bindTile, snapRadius };
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/game.js */
/* Level state machine and everything that wires the other modules together.
 *
 * Design rule that shapes all of this: there is no timer, no score, and no way
 * to lose. A wrong drop costs nothing and quietly makes the next attempt easier.
 */
(function (IMP) {
  'use strict';

  const CFG = IMP.config;
  const { shuffle } = IMP.util;
  const M = window.INDIA_MAP;

  const dom = {};

  let level = 1;
  let active = [];       // states in this level
  let queue = [];        // not yet shown in the tray
  let placedPaths = {};
  let placedCount = 0;
  const misses = {};     // state id -> wrong drops, drives the escalating hints

  // --- tray ---------------------------------------------------------------

  /**
   * Refill the tray up to TRAY_MAX.
   *
   * The "always keep one big piece visible" rule is the important part: a tray
   * showing only Goa, Sikkim and Tripura is a tray with no achievable win on it,
   * and that is where a four-year-old gives up.
   */
  function refillTray() {
    const shown = dom.tray.querySelectorAll('.tile').length;
    let need = CFG.TRAY_MAX - shown;
    if (need <= 0 || !queue.length) return;

    const bigOnScreen = Array.prototype.some.call(
      dom.tray.querySelectorAll('.tile'),
      function (t) {
        const s = IMP.render.byId[t.dataset.id];
        return s && s.minScale === 1;
      }
    );

    while (need > 0 && queue.length) {
      let idx = 0;
      if (!bigOnScreen && dom.tray.querySelectorAll('.tile').length === 0) {
        const big = queue.findIndex(function (s) { return s.minScale === 1; });
        if (big > -1) idx = big;
      }
      const state = queue.splice(idx, 1)[0];
      const tile = IMP.render.buildTile(state);
      IMP.drag.bindTile(tile, state);
      dom.tray.appendChild(tile);
      need--;
    }
    updateRovingTabindex();
  }

  // --- placement ----------------------------------------------------------

  function onPlace(state) {
    const path = placedPaths[state.id];
    if (path) {
      path.setAttribute('opacity', '1');
      if (path._group) path._group.setAttribute('opacity', '1');
      IMP.effects.replay(path._group || path, 'pop', 320);
    }

    const slot = dom.board.querySelector('.slot[data-id="' + state.id + '"]');
    if (slot) {
      slot.classList.remove('nudge');
      slot.style.opacity = '0';
    }

    placedCount++;
    IMP.audio.playCorrect();
    IMP.speech.sayState(state, 'PLACED');
    announce(state.name + ' placed. ' + placedCount + ' of ' + active.length + ' done.');

    if (IMP.store.earnSticker(state.id)) {
      /* first time this state has ever been placed -- sticker book grows */
    }

    updateProgress();
    refillTray();

    if (placedCount === active.length) setTimeout(win, 420);
  }

  function onMiss(state) {
    misses[state.id] = (misses[state.id] || 0) + 1;
    if (misses[state.id] >= CFG.HINT_AFTER) {
      const slot = dom.board.querySelector('.slot[data-id="' + state.id + '"]');
      if (slot) slot.classList.add('nudge');
    }
  }

  // --- level lifecycle ----------------------------------------------------

  function startLevel(next) {
    level = next;
    IMP.store.setSetting('level', level);

    active = M.states.filter(function (s) { return s.level <= level; });
    queue = shuffle(active.slice());
    placedCount = 0;
    for (const k in misses) delete misses[k];

    placedPaths = IMP.render.buildBoard(dom.board, active);
    dom.tray.innerHTML = '';
    dom.win.hidden = true;
    IMP.effects.clear();

    refillTray();
    updateProgress();

    Array.prototype.forEach.call(dom.chips, function (chip) {
      chip.setAttribute('aria-selected', String(+chip.dataset.level === level));
    });

    announce('Level ' + level + '. ' + active.length + ' pieces to place.');
  }

  function win() {
    const trophy = 'trophy-' + level;
    IMP.store.earnSticker(trophy);

    dom.win.hidden = false;
    dom.winEmoji.textContent = level === 3 ? '🏆' : '🎉';
    dom.winTitle.textContent = level === 3 ? 'All of India!' : 'You did it!';
    dom.winSub.textContent =
      'You placed ' + active.length + ' pieces. You earned a sticker!';
    dom.next.hidden = level >= 3;

    IMP.audio.playFanfare();
    IMP.speech.sayFrom(level === 3 ? 'WIN_ALL' : 'WIN');
    IMP.effects.confetti(level === 3 ? 200 : 130);
    announce('Level complete. You earned a sticker.');
  }

  function updateProgress() {
    dom.progress.textContent = placedCount + ' / ' + active.length;
  }

  function announce(text) {
    dom.live.textContent = text;
  }

  // --- keyboard -----------------------------------------------------------

  /* Roving tabindex: the tray is one tab stop and arrows move within it, which is
     the expected pattern for a listbox and stops 36 tiles flooding the tab order. */
  function updateRovingTabindex() {
    const tiles = dom.tray.querySelectorAll('.tile');
    tiles.forEach(function (t, i) {
      t.tabIndex = i === 0 ? 0 : -1;
    });
  }

  function onTrayKey(e) {
    const tiles = Array.prototype.slice.call(dom.tray.querySelectorAll('.tile'));
    if (!tiles.length) return;
    const i = tiles.indexOf(document.activeElement);

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      focusTile(tiles, i < 0 ? 0 : (i + 1) % tiles.length);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      focusTile(tiles, i <= 0 ? tiles.length - 1 : i - 1);
    } else if ((e.key === 'Enter' || e.key === ' ') && i > -1) {
      /* Places the piece directly. With no score and no losing this is not
         cheating -- it is the assist path, it is how a grown-up helps, and it is
         the only way to play at all without a pointing device. */
      e.preventDefault();
      const state = IMP.render.byId[tiles[i].dataset.id];
      IMP.audio.unlock();
      IMP.speech.unlock();
      tiles[i].remove();
      onPlace(state);
    }
  }

  function focusTile(tiles, idx) {
    tiles.forEach(function (t, n) { t.tabIndex = n === idx ? 0 : -1; });
    tiles[idx].focus();
  }

  // --- sound toggle -------------------------------------------------------

  function setMuted(muted) {
    IMP.audio.setMuted(muted);
    IMP.speech.setMuted(muted);
    IMP.store.setSetting('muted', muted);
    dom.mute.setAttribute('aria-pressed', String(muted));
    dom.mute.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
  }

  // --- boot ---------------------------------------------------------------

  function boot() {
    dom.board = document.getElementById('board');
    dom.tray = document.getElementById('tray');
    dom.progress = document.getElementById('progress');
    dom.live = document.getElementById('live');
    dom.mute = document.getElementById('mute');
    dom.win = document.getElementById('win');
    dom.winEmoji = document.getElementById('win-emoji');
    dom.winTitle = document.getElementById('win-title');
    dom.winSub = document.getElementById('win-sub');
    dom.next = document.getElementById('next');
    dom.again = document.getElementById('again');
    dom.chips = document.querySelectorAll('.chip');

    // Weak devices get the flat style: 36 drop-shadowed paths is where a cheap
    // tablet starts dropping frames.
    if (IMP.util.reducedMotion() || (navigator.hardwareConcurrency || 8) <= 4) {
      document.body.classList.add('low-fx');
    }

    IMP.effects.init();
    IMP.drag.attach(dom.board, {
      onPlace,
      onMiss,
      getLevel: function () { return level; },
      misses: function (id) { return misses[id] || 0; },
    });

    const settings = IMP.store.getSettings();
    setMuted(!!settings.muted);

    dom.mute.addEventListener('click', function () {
      setMuted(dom.mute.getAttribute('aria-pressed') !== 'true');
    });

    Array.prototype.forEach.call(dom.chips, function (chip) {
      chip.addEventListener('click', function () {
        startLevel(+chip.dataset.level);
      });
    });

    dom.again.addEventListener('click', function () { startLevel(level); });
    dom.next.addEventListener('click', function () {
      startLevel(Math.min(3, level + 1));
    });

    dom.tray.addEventListener('keydown', onTrayKey);

    window.addEventListener(
      'resize',
      IMP.util.debounce(function () { /* board rescales itself via viewBox */ }, 120)
    );

    startLevel(settings.level && settings.level <= 3 ? settings.level : 1);

    // Test hook. Deliberately minimal: just enough for Playwright to drive a
    // level to completion without simulating 36 drags.
    window.__IMP_TEST__ = {
      place: function (id) {
        const tile = dom.tray.querySelector('.tile[data-id="' + id + '"]');
        if (tile) tile.remove();
        onPlace(IMP.render.byId[id]);
      },
      state: function () {
        return { level, placed: placedCount, total: active.length };
      },
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})((window.IMP = window.IMP || {}));

</script>
<script>
/* js/stickers.js */
/* The sticker book, as an in-page overlay.
 *
 * A sticker for every state ever placed, plus a trophy per level. Empty slots
 * are drawn greyed out rather than hidden, because for a small child the point
 * of a collection is seeing the gaps you could still fill.
 *
 * Rendered on open rather than at load: the contents change every time a piece
 * is placed, so building it once at startup would go stale immediately.
 */
(function (IMP) {
  'use strict';

  const TROPHIES = [
    { id: 'trophy-1', emoji: '🥉', name: 'Six Big Ones', cap: 'Level 1 done' },
    { id: 'trophy-2', emoji: '🥈', name: 'Twelve States', cap: 'Level 2 done' },
    { id: 'trophy-3', emoji: '🏆', name: 'All of India', cap: 'Level 3 done' },
  ];

  function card(item, earned) {
    const d = document.createElement('div');
    d.className = 'sticker ' + (earned ? 'earned' : 'locked');
    d.dataset.id = item.id;

    const e = document.createElement('span');
    e.className = 'sticker-emoji';
    e.textContent = earned ? item.emoji : '❔';

    const n = document.createElement('span');
    n.className = 'sticker-name';
    n.textContent = earned ? item.name : '???';

    const c = document.createElement('span');
    c.className = 'sticker-cap';
    c.textContent = earned ? item.cap : 'Not yet';

    d.appendChild(e);
    d.appendChild(n);
    d.appendChild(c);
    return d;
  }

  function render() {
    const M = window.INDIA_MAP;
    const owned = IMP.store.getStickers();
    const has = function (id) { return owned.indexOf(id) !== -1; };

    const trophyGrid = document.getElementById('trophies');
    trophyGrid.innerHTML = '';
    TROPHIES.forEach(function (t) {
      trophyGrid.appendChild(card(t, has(t.id)));
    });

    const stateGrid = document.getElementById('states');
    stateGrid.innerHTML = '';
    let earned = 0;

    M.states
      .slice()
      .sort(function (a, b) { return a.name.localeCompare(b.name); })
      .forEach(function (s) {
        const got = has(s.id);
        if (got) earned++;
        stateGrid.appendChild(
          card({ id: s.id, emoji: s.emoji, name: s.name, cap: s.sticker }, got)
        );
      });

    document.getElementById('state-sub').textContent =
      earned + ' of ' + M.states.length + ' collected.' +
      (IMP.store.persistent ? '' : ' (This device cannot save stickers.)');

    document.getElementById('trophy-sub').textContent =
      TROPHIES.filter(function (t) { return has(t.id); }).length + ' of 3 trophies won.';
  }

  function open() {
    render();
    document.getElementById('book').hidden = false;
    const btn = document.getElementById('open-stickers');
    if (btn) btn.setAttribute('aria-expanded', 'true');
    const close = document.getElementById('close-book');
    if (close) close.focus();
  }

  function close() {
    document.getElementById('book').hidden = true;
    const btn = document.getElementById('open-stickers');
    if (btn) {
      btn.setAttribute('aria-expanded', 'false');
      btn.focus();
    }
  }

  function boot() {
    const openBtn = document.getElementById('open-stickers');
    const winBtn = document.getElementById('win-stickers');
    const closeBtn = document.getElementById('close-book');
    if (!openBtn) return;   // not the game page

    openBtn.addEventListener('click', open);
    if (winBtn) winBtn.addEventListener('click', open);
    if (closeBtn) closeBtn.addEventListener('click', close);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !document.getElementById('book').hidden) close();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  IMP.stickers = { open, close, render };
})((window.IMP = window.IMP || {}));

</script>
</body>
</html>
